# Secret names below are placeholders — reconcile against this repo's actual
# Woodpecker secrets once it's registered (harbor_username/harbor_password,
# bitbucket_token).
when:
  - event: [push, pull_request, manual]

steps:
  # version-file lives directly in this repo (scripts/version-file/) rather than as a
  # published plugin image — same "vendored, not pulled" pattern outbound-images-with-ca uses for
  # fan_out.py.
  - name: version
    image: harbor.devopstashtiot.page/inbound_images/base/python3.11:latest
    environment:
      PLUGIN_BASE_PATH: .
      PLUGIN_CHANGELOG_LEVEL: "2"
      PLUGIN_CLIFF_TOML: cliff.toml
      PLUGIN_OUTPUT_TAGS_FILE: new_tags.txt
      PLUGIN_BITBUCKET_TOKEN:
        from_secret: bitbucket_token
    commands:
      - python3 scripts/version-file/release.py

  - name: build-and-push
    image: harbor.devopstashtiot.page/inbound_images/plugins/buildah-master-versions:latest
    environment:
      PLUGIN_BASE_PATH: .
      PLUGIN_REGISTRY: harbor.devopstashtiot.page
      PLUGIN_REPO: inbound_images
      PLUGIN_TAGS_FILE: new_tags.txt
      PLUGIN_USERNAME:
        from_secret: harbor_username
      PLUGIN_PASSWORD:
        from_secret: harbor_password

  - name: commit-back
    image: alpine/git
    environment:
      BITBUCKET_TOKEN:
        from_secret: bitbucket_token
    commands:
      - git config user.name "inbound-images-bot"
      - git config user.email "ci@devopstashtiot.page"
      - find . -name "VERSION.txt" -o -name "CHANGELOG.md" | grep -v '^\./\.git' | xargs -r git add
      - >-
        git diff --cached --quiet ||
        (git commit -m "chore: version-file release [skip ci]" &&
        git -c http.extraheader="Authorization: Bearer $${BITBUCKET_TOKEN}" push origin HEAD:$${CI_COMMIT_BRANCH})
      - |
        if [ -s new_tags.txt ]; then
          for t in $(cat new_tags.txt); do git tag -f "$t"; done
          git -c http.extraheader="Authorization: Bearer $${BITBUCKET_TOKEN}" push --force --tags origin
        fi
