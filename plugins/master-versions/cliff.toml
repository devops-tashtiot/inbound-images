[git]
conventional_commits = false 

commit_parsers = [    
 # breaking - MAJOR bump because of custom_major_increment_regex
  { message = "^breaking", group = "🚀 🚀 Breaking Changes" },
 # feat - MINOR bump as usual conventional_commits
  { message = "^feat",     group = "✨ Features" },
 # fix - PATCH bump as usual conventional_commits
  { message = "^fix",      group = "🐛 Bug Fixes" },
 # other - SKIPPED
  { message = "^other", group = "📦 other",skip = true },
  { message = "^code_description", group = "📦 code description",skip = true }

]
[bump]
custom_major_increment_regex = "^breaking"

[changelog]
trim = false
body = """
{% if version %}\
    ## [{{ version }}]({{ get_env(name="CI_REPO_URL", default="") }}/browse?refs={{ version }}) - {{ timestamp | date(format="%Y-%m-%d %H:%M") }}

{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
* {{ commit.message | replace(from="\n", to="  \n  ") }}
{% endfor %}
{% endfor %}
"""
